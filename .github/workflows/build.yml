name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          echo "Estructura:"
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 7. Corregir atributos en vectores
        shell: bash
        run: |
          set -e
          echo "Reemplazando referencias a colores en archivos de vectores..."
          if [ -d "project/app/src/main/res/drawable/" ]; then
            find project/app/src/main/res/drawable/ -name "*.xml" -exec sed -i \
              -e 's/?attr\/colorPrimary/#6200EE/g' \
              -e 's/?attr\/colorPrimaryDark/#3700B3/g' \
              -e 's/?attr\/colorSecondary/#03DAC6/g' \
              -e 's/?attr\/colorTertiary/#018786/g' \
              -e 's/?attr\/diamondIconColor/#FFD700/g' \
              -e 's/?attr\/colorStroke/#000000/g' \
              -e 's/?attr\/label_tertiary_active/#FF0000/g' \
              -e 's/?attr\/backgrounds_secondary_active/#CCCCCC/g' \
              {} + || true
          fi
          echo "Corrección completada."

      - name: 7.5. Forzar configuración correcta de Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project
          
          echo "Generando un settings.gradle limpio..."
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          echo "Asegurando el bloque plugins en app/build.gradle con versión..."
          if [ -f "app/build.gradle" ]; then
            # Si el archivo usa 'id "com.android.application"', le agregamos la versión si no la tiene
            if grep -q "com.android.application" app/build.gradle && ! grep -q "version" app/build.gradle; then
              sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
              sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle
            fi
          fi
          
          cd ..

      - name: 8. Compilar
        shell: bash
        run: |
          set -o pipefail
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
