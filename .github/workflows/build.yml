name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          echo "Estructura:"
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # PASO 7 — VECTORES: reemplaza TODAS las referencias simbólicas
      # Cubre: @color/, @drawable/, ?attr/  y width/height=0
      # ============================================================
      - name: 7. Corregir vectores (referencias y dimensiones)
        shell: bash
        run: |
          set -e
          echo "== 7.1 Reemplazando referencias simbólicas en vectores =="
          if [ -d "project/app/src/main/res/drawable/" ]; then
            find project/app/src/main/res/drawable/ -name "*.xml" -print0 \
              | xargs -0 -r sed -i \
                -e 's/\(strokeColor\|fillColor\)="@color\/[^"]*"/\1="#FF000000"/g' \
                -e 's/\(strokeColor\|fillColor\)="@android:color\/[^"]*"/\1="#FF000000"/g' \
                -e 's/\(strokeColor\|fillColor\)="@drawable\/[^"]*"/\1="#FF000000"/g' \
                -e 's/\(strokeColor\|fillColor\)="?attr\/[^"]*"/\1="#FF000000"/g' \
                -e 's/\(strokeColor\|fillColor\)="?android:attr\/[^"]*"/\1="#FF000000"/g' \
                -e 's/android:width="0[^"]*"/android:width="24dp"/g' \
                -e 's/android:height="0[^"]*"/android:height="24dp"/g'
          fi
          echo "== 7.2 Verificación (debería salir vacío) =="
          grep -rEl '(strokeColor|fillColor)="(@color/|@drawable/|@android:color/|\?attr/|\?android:attr/)' \
            project/app/src/main/res/drawable/ 2>/dev/null || echo "OK: sin referencias simbólicas"
          grep -rEl 'android:(width|height)="0' \
            project/app/src/main/res/drawable/ 2>/dev/null || echo "OK: sin dimensiones 0"

      # ============================================================
      # PASO 7.2 — XML DE STRINGS: arregla ]]> y <item> sin quantity
      # ============================================================
      - name: 7.2. Corregir XML de strings y plurals
        shell: bash
        run: |
          set -e
          RES="project/app/src/main/res"

          echo "== 7.2.1 Escapando ]]> suelto =="
          find "$RES" -type f -name "*.xml" -print0 \
            | xargs -0 -r sed -i 's/]]>/]]\&gt;/g'

          echo "== 7.2.2 Añadiendo quantity=\"other\" a <item> sin atributo =="
          # Solo toca <item> EXACTO (sin atributos). Los que ya tienen
          # quantity u otros atributos no coinciden con el patrón.
          find "$RES" -type f -name "strings.xml" -print0 \
            | xargs -0 -r sed -i -E 's|<item>([^<]*)</item>|<item quantity="other">\1</item>|g'

          echo "== 7.2.3 Verificación =="
          if grep -rn ']]>' "$RES" 2>/dev/null; then
            echo "::error::Aún quedan ]]> sin escapar"
            exit 1
          fi
          if grep -rn '<item>' "$RES"/values*/strings.xml 2>/dev/null; then
            echo "::warning::Aún quedan <item> sin quantity (revisar manualmente)"
          fi
          echo "Corrección de XML completada."

      # ============================================================
      # PASO 7.4 — Validación con xmllint (gate temprano)
      # ============================================================
      - name: 7.4. Validar todos los XML de recursos
        shell: bash
        run: |
          set -e
          RES="project/app/src/main/res"
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          fi
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! xmllint --noout "$f" 2>/dev/null; then
              echo "::error file=$f::XML inválido"
              xmllint --noout "$f" 2>&1 || true
              FAILED=1
            fi
          done < <(find "$RES" -type f -name "*.xml" -print0)
          if [ "$FAILED" -eq 1 ]; then
            echo "Hay XML mal formados. Abortando antes de Gradle."
            exit 1
          fi
          echo "OK: todos los XML son válidos."

      - name: 7.5. Forzar configuración correcta de Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project

          echo "Generando un settings.gradle robusto..."
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          echo "Asegurando que el plugin en app/build.gradle tenga la versión correcta..."
          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle

            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi

          cd ..

      - name: 7.7. Diagnóstico de recursos
        shell: bash
        run: |
          echo "Cantidad de archivos en res/:"
          find project/app/src/main/res -type f 2>/dev/null | wc -l || true
          echo "Peso de res/:"
          du -sh project/app/src/main/res 2>/dev/null || true
          echo "Vectores con referencias residuales (debe estar vacío):"
          grep -rEl '(strokeColor|fillColor)="(@color/|@drawable/|\?attr/)' \
            project/app/src/main/res/drawable/ 2>/dev/null || echo "OK"
          echo "Primeras líneas de app/build.gradle:"
          head -30 project/app/build.gradle 2>/dev/null || true

      - name: 7.9. Configurar memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          echo "gradle.properties generado:"
          cat gradle.properties
          cd ..

      - name: 8. Compilar
        shell: bash
        run: |
          set -o pipefail
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
