name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # PASO 6.5 — UTF-8
      # ============================================================
      - name: 6.5. Normalizar encoding de XML
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          echo "===== STEP 6.5 =====" | tee -a "$LOG"
          RES="project/app/src/main/res"
          COUNT=0
          while IFS= read -r -d '' f; do
            ENC=$(file --mime-encoding -b "$f" 2>/dev/null || echo "unknown")
            case "$ENC" in
              utf-8|us-ascii|ascii|utf8) ;;
              *)
                echo "[ICONV] $f : $ENC" | tee -a "$LOG"
                if iconv -f "$ENC" -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                  mv "$f.tmp" "$f"; COUNT=$((COUNT+1))
                else
                  rm -f "$f.tmp"
                  if iconv -f UTF-16 -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                    mv "$f.tmp" "$f"; COUNT=$((COUNT+1))
                  else
                    rm -f "$f.tmp"
                  fi
                fi
                ;;
            esac
          done < <(find "$RES" -type f -name "*.xml" -print0)
          echo "Convertidos: $COUNT" | tee -a "$LOG"

      # ============================================================
      # PASO 7 — VECTORES
      # ============================================================
      - name: 7. Corregir vectores
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7: VECTORES =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          BASE = "project/app/src/main/res"
          DIRS = [d for d in os.listdir(BASE) if d.startswith("drawable")] if os.path.isdir(BASE) else []
          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )
          def lit(m): return f'{m.group(1)}="#FF000000"'
          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)
          fixed = 0
          for d in DIRS:
              full = os.path.join(BASE, d)
              for root, _, files in os.walk(full):
                  for fn in files:
                      if not fn.lower().endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      with open(p, "r", encoding="utf-8", errors="replace") as f:
                          src = f.read()
                      orig = src
                      src = RE_REF.sub(lit, src)
                      m = RE_VEC_OPEN.search(src)
                      if m:
                          vec = m.group(0); fixedv = vec
                          wm = re.search(r'android:width\s*=\s*"([^"]*)"', vec)
                          if wm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', wm.group(1)):
                                  fixedv = fixedv[:wm.start(1)] + "24dp" + fixedv[wm.end(1):]
                          else:
                              fixedv = fixedv[:-1] + ' android:width="24dp">'
                          hm = re.search(r'android:height\s*=\s*"([^"]*)"', vec)
                          if hm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', hm.group(1)):
                                  fixedv = fixedv[:hm.start(1)] + "24dp" + fixedv[hm.end(1):]
                          else:
                              fixedv = fixedv[:-1] + ' android:height="24dp">'
                          if fixedv != vec:
                              src = src.replace(vec, fixedv, 1)
                      if src != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(src)
                          fixed += 1
          print(f"Vectores corregidos: {fixed}")
          PYEOF

      # ============================================================
      # PASO 7.2 — STRINGS / PLURALS (source)
      # ============================================================
      - name: 7.2. Corregir strings y plurals (source)
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.2 =====" | tee -a "$LOG"
          RES="project/app/src/main/res"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"
          RE_PLURAL = re.compile(r'(<plurals\b[^>]*>)(.*?)(</plurals>)', re.DOTALL)
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)
          fix = 0
          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  try: src = open(p, encoding="utf-8", errors="replace").read()
                  except: continue
                  orig = src
                  if ']]>' in src:
                      src = src.replace(']]>', ']]&gt;')
                  def repl(m):
                      head, body, tail = m.group(1), m.group(2), m.group(3)
                      def fx(im):
                          attrs = im.group(1) or ""
                          if 'quantity' in attrs: return im.group(0)
                          return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                      return head + RE_ITEM.sub(fx, body) + tail
                  src = RE_PLURAL.sub(repl, src)
                  if src != orig:
                      open(p, "w", encoding="utf-8").write(src)
                      print(f"[source fix] {p}")
                      fix += 1
          print(f"Source files corregidos: {fix}")
          PYEOF

      # ============================================================
      # PASO 7.3 — ELIMINAR .9.png
      # ============================================================
      - name: 7.3. Eliminar .9.png corruptos
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.3 =====" | tee -a "$LOG"
          find project/app/src/main/res -name "*.9.png" -type f -delete 2>&1 | tee -a "$LOG" || true
          echo "Restantes: $(find project/app/src/main/res -name '*.9.png' -type f 2>/dev/null | wc -l)" | tee -a "$LOG"

      # ============================================================
      # PASO 7.4 — VERIFICAR SOURCE
      # ============================================================
      - name: 7.4. Verificación source
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.4 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"
          gt, pl = [], []
          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  src = open(p, encoding="utf-8", errors="replace").read()
                  if ']]>' in src: gt.append(p)
                  for m in re.finditer(r'<plurals\b[^>]*>(.*?)</plurals>', src, re.DOTALL):
                      for im in re.finditer(r'<item(\s[^>]*)?>', m.group(1)):
                          if 'quantity' not in (im.group(1) or ''):
                              pl.append((p, im.group(0)[:80]))
          print(f"]]> en source: {len(gt)}")
          print(f"plurals sin quantity en source: {len(pl)}")
          print("OK source" if not gt and not pl else "WARN source")
          PYEOF

      # ============================================================
      # PASO 7.5 — CONFIGURAR GRADLE
      # ============================================================
      - name: 7.5. Configurar Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle
            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi
          cd ..

      - name: 7.7. Diagnóstico de proyectos y AARs
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.7: DIAGNÓSTICO =====" | tee -a "$LOG"
          echo "--- Archivos en res/: $(find project/app/src/main/res -type f | wc -l) ---" | tee -a "$LOG"
          echo "--- Peso res/: $(du -sh project/app/src/main/res | cut -f1) ---" | tee -a "$LOG"
          echo "--- AARs locales ---" | tee -a "$LOG"
          find project -name "*.aar" 2>/dev/null | head -30 | tee -a "$LOG" || echo "(ninguno)" | tee -a "$LOG"
          echo "--- Otras carpetas res (fuera de build/) ---" | tee -a "$LOG"
          find project -type d -name "res" 2>/dev/null | grep -v "/build/" | head -30 | tee -a "$LOG"
          echo "--- Buscar 'custom_gifts_guidelines_info_monthly_limit' ---" | tee -a "$LOG"
          grep -rl "custom_gifts_guidelines_info_monthly_limit" project/ 2>/dev/null | head -10 | tee -a "$LOG" || echo "(no encontrado)" | tee -a "$LOG"

      - name: 7.9. Memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          cd ..

      # ============================================================
      # PASO 7.9.5 — POBLAR CACHE + PATCH AAR TRANSFORMS
      # ============================================================
      - name: 7.9.5. Poblar cache y parchear AARs extraídos
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.9.5: POPULATE CACHE + PATCH AARs =====" | tee -a "$LOG"

          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

          echo "--- Resolviendo dependencias (popula cache) ---" | tee -a "$LOG"
          set +e
          "$G" --no-daemon --offline=false :app:dependencies --configuration debugRuntimeClasspath 2>&1 | tail -10 | tee -a "$LOG"
          set -e

          echo "--- Parcheando transforms de AARs extraídos ---" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re, glob

          HOME = os.path.expanduser("~")
          CACHE = os.path.join(HOME, ".gradle", "caches")
          if not os.path.isdir(CACHE):
              print("No hay cache")
              raise SystemExit(0)

          RE_PLURAL = re.compile(r'(<plurals\b[^>]*>)(.*?)(</plurals>)', re.DOTALL)
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)

          def fix_xml(text):
              orig = text
              text = text.replace(']]>', ']]&gt;')
              def repl(m):
                  head, body, tail = m.group(1), m.group(2), m.group(3)
                  def fx(im):
                      attrs = im.group(1) or ""
                      if 'quantity' in attrs: return im.group(0)
                      return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                  return head + RE_ITEM.sub(fx, body) + tail
              text = RE_PLURAL.sub(repl, text)
              return text, text != orig

          total = 0
          # 1) Buscar en transforms-*
          for tdir in glob.glob(os.path.join(CACHE, "transforms-*")):
              for root, _, files in os.walk(tdir):
                  if "/transformed/" not in root.replace("\\","/"): continue
                  for fn in files:
                      if not fn.endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      if "/values" not in p: continue
                      try:
                          with open(p, "r", encoding="utf-8", errors="replace") as f:
                              text = f.read()
                          text2, ch = fix_xml(text)
                          if ch:
                              with open(p, "w", encoding="utf-8") as f:
                                  f.write(text2)
                              print(f"[TRANSFORM] {p}")
                              total += 1
                      except Exception:
                          pass
          # 2) Buscar también en exploded-aar / módulos
          for root_dir in [os.path.join(CACHE, "modules-2")]:
              if not os.path.isdir(root_dir): continue
              for root, _, files in os.walk(root_dir):
                  for fn in files:
                      if not fn.endswith(".xml"): continue
                      if "/res/values" not in root.replace("\\","/"): continue
                      p = os.path.join(root, fn)
                      try:
                          with open(p, "r", encoding="utf-8", errors="replace") as f:
                              text = f.read()
                          text2, ch = fix_xml(text)
                          if ch:
                              with open(p, "w", encoding="utf-8") as f:
                                  f.write(text2)
                              print(f"[MODULE] {p}")
                              total += 1
                      except Exception:
                          pass
          print(f"Archivos parcheados en cache: {total}")
          PYEOF

      # ============================================================
      # PASO 8 — COMPILAR
      # ============================================================
      - name: 8. Compilar
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8: GRADLE BUILD =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

          set +e
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "" | tee -a "$LOG"
            echo "===== DIAGNÓSTICO POST-FALLO =====" | tee -a "$LOG"
            MERGED="app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir"
            [ -f "$MERGED/values/values.xml" ] && \
              echo "--- ]]> residuales en merged/values ---" | tee -a "$LOG" && \
              grep -n ']]>' "$MERGED/values/values.xml" | head -10 | tee -a "$LOG"
            [ -f "$MERGED/values-hi/values-hi.xml" ] && \
              echo "--- <item> sin quantity en merged/values-hi ---" | tee -a "$LOG" && \
              grep -n '<item>' "$MERGED/values-hi/values-hi.xml" | head -10 | tee -a "$LOG"
          fi

          exit $RC

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
