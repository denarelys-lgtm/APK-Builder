name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # PASO 6.5 — CONVERTIR TODOS LOS XML A UTF-8 (causa raíz)
      # ============================================================
      - name: 6.5. Convertir todos los XML a UTF-8
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 6.5: UTF-8 NORMALIZATION =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, codecs
          RES = "project/app/src/main/res"

          def read_any(path):
              with open(path, "rb") as f:
                  raw = f.read()
              if raw.startswith(codecs.BOM_UTF8):
                  return raw[3:].decode("utf-8"), "utf-8-bom"
              if raw.startswith(codecs.BOM_UTF16_LE):
                  return raw.decode("utf-16-le"), "utf-16-le"
              if raw.startswith(codecs.BOM_UTF16_BE):
                  return raw.decode("utf-16-be"), "utf-16-be"
              # Sin BOM: heurística
              # Si hay muchos \x00 intercalados, es UTF-16
              nulls = raw[:200].count(b"\x00")
              if nulls > 20:
                  # probar LE vs BE
                  try:
                      text = raw.decode("utf-16-le")
                      if text.count("\x00") > 5:
                          text = raw.decode("utf-16-be")
                  except UnicodeDecodeError:
                      text = raw.decode("utf-16-le", errors="replace")
                  return text, "utf-16-heuristic"
              try:
                  return raw.decode("utf-8"), "utf-8"
              except UnicodeDecodeError:
                  return raw.decode("latin-1"), "latin-1"

          converted = 0
          for root, _, files in os.walk(RES):
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  path = os.path.join(root, fn)
                  try:
                      text, enc = read_any(path)
                  except Exception as e:
                      print(f"[ERR] {path}: {e}")
                      continue
                  if enc != "utf-8":
                      print(f"[UTF8] {path}  ({enc} -> utf-8)")
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)
                      converted += 1
          print(f"Convertidos a UTF-8: {converted}")
          PYEOF

      # ============================================================
      # PASO 7 — VECTORES
      # ============================================================
      - name: 7. Corregir vectores
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7: VECTORES =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          BASE = "project/app/src/main/res"
          DIRS = [d for d in os.listdir(BASE) if d.startswith("drawable")] if os.path.isdir(BASE) else []

          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )
          def lit(m): return f'{m.group(1)}="#FF000000"'
          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)
          fixed = 0

          for d in DIRS:
              full = os.path.join(BASE, d)
              for root, _, files in os.walk(full):
                  for fn in files:
                      if not fn.lower().endswith(".xml"): continue
                      path = os.path.join(root, fn)
                      with open(path, "r", encoding="utf-8", errors="replace") as f:
                          src = f.read()
                      orig = src
                      src = RE_REF.sub(lit, src)
                      m = RE_VEC_OPEN.search(src)
                      if m:
                          vec = m.group(0); fixedv = vec
                          wm = re.search(r'android:width\s*=\s*"([^"]*)"', vec)
                          if wm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', wm.group(1)):
                                  fixedv = fixedv[:wm.start(1)] + "24dp" + fixedv[wm.end(1):]
                          else:
                              fixedv = fixedv[:-1] + ' android:width="24dp">'
                          hm = re.search(r'android:height\s*=\s*"([^"]*)"', vec)
                          if hm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', hm.group(1)):
                                  fixedv = fixedv[:hm.start(1)] + "24dp" + fixedv[hm.end(1):]
                          else:
                              fixedv = fixedv[:-1] + ' android:height="24dp">'
                          if fixedv != vec:
                              src = src.replace(vec, fixedv, 1)
                      if src != orig:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(src)
                          fixed += 1
          print(f"Vectores corregidos: {fixed}")
          PYEOF

      # ============================================================
      # PASO 7.2 — STRINGS/PLURALS (state machine + arrays/plurals)
      # ============================================================
      - name: 7.2. Corregir strings y plurals
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.2: STRINGS / PLURALS =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"

          def fix_gt_sequences(text):
              out = []
              i = 0
              n = len(text)
              while i < n:
                  next_cdata = text.find("<![CDATA[", i)
                  next_close = text.find("]]>", i)
                  if next_close == -1:
                      out.append(text[i:]); break
                  if next_cdata != -1 and next_cdata < next_close:
                      cdata_end = text.find("]]>", next_cdata + 9)
                      if cdata_end == -1:
                          out.append(text[i:next_cdata])
                          out.append(text[next_cdata:].replace("]]>", "]]&gt;"))
                          break
                      out.append(text[i:cdata_end + 3])
                      i = cdata_end + 3
                  else:
                      out.append(text[i:next_close])
                      out.append("]]&gt;")
                      i = next_close + 3
              return "".join(out)

          RE_PLURAL_BLOCK = re.compile(r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL)
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)

          def fix_plural_block(m):
              block = m.group(0)
              def fix_item(im):
                  attrs = im.group(1) or ""
                  content = im.group(2)
                  if 'quantity' in attrs:
                      return im.group(0)
                  return f'<item quantity="other"{attrs}>{content}</item>'
              return RE_ITEM.sub(fix_item, block)

          fixed = 0
          scanned = 0
          for root, _, files in os.walk(RES):
              # Solo procesar carpetas values*/
              parent = os.path.basename(root)
              if not parent.startswith("values"):
                  continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  path = os.path.join(root, fn)
                  scanned += 1
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      src = f.read()
                  orig = src
                  src = fix_gt_sequences(src)
                  src = RE_PLURAL_BLOCK.sub(fix_plural_block, src)
                  if src != orig:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(src)
                      print(f"[STRINGS] {path}")
                      fixed += 1
          print(f"Archivos values* escaneados: {scanned}")
          print(f"Strings/plurals corregidos: {fixed}")
          PYEOF

      # ============================================================
      # PASO 7.3 — ELIMINAR .9.png
      # ============================================================
      - name: 7.3. Eliminar .9.png corruptos
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.3: DELETE 9.PNG =====" | tee -a "$LOG"
          find project/app/src/main/res -name "*.9.png" -type f -print -delete 2>&1 | tee -a "$LOG" || true
          REMAIN=$(find project/app/src/main/res -name "*.9.png" -type f 2>/dev/null | wc -l)
          echo "Restantes: $REMAIN" | tee -a "$LOG"

      # ============================================================
      # PASO 7.4 — Verificación CORREGIDA (solo archivos values*/strings.xml)
      # ============================================================
      - name: 7.4. Verificar valores
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.4: VERIFICACIÓN =====" | tee -a "$LOG"

          echo "--- ]]> en values*/strings.xml ---" | tee -a "$LOG"
          FOUND=0
          while IFS= read -r -d '' f; do
            if grep -q ']]>' "$f" 2>/dev/null; then
              echo "  $f" | tee -a "$LOG"; FOUND=1
            fi
          done < <(find project/app/src/main/res -type f -path "*/values*/*.xml" -print0)
          [ "$FOUND" -eq 0 ] && echo "  OK" | tee -a "$LOG"

          echo "--- <plurals> con <item> sin quantity ---" | tee -a "$LOG"
          FOUND=0
          while IFS= read -r -d '' f; do
            # Busca bloques plurals y verifica items
            if python3 -c "
          import sys, re
          src = open('$f', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'<plurals\b[^>]*>(.*?)</plurals>', src, re.DOTALL):
              for im in re.finditer(r'<item(\s[^>]*)?>', m.group(1)):
                  attrs = im.group(1) or ''
                  if 'quantity' not in attrs:
                      sys.exit(1)
          sys.exit(0)
          " 2>/dev/null; then :; else
              echo "  $f" | tee -a "$LOG"; FOUND=1
            fi
          done < <(find project/app/src/main/res -type f -path "*/values*/*.xml" -print0)
          [ "$FOUND" -eq 0 ] && echo "  OK" | tee -a "$LOG"

          echo "--- Vectores con referencias simbólicas ---" | tee -a "$LOG"
          FOUND=0
          while IFS= read -r -d '' f; do
            if grep -qE '(strokeColor|fillColor)="(@color/|@drawable/|\?attr/)' "$f" 2>/dev/null; then
              echo "  $f" | tee -a "$LOG"; FOUND=1
            fi
          done < <(find project/app/src/main/res -type f -path "*/drawable*/*.xml" -print0)
          [ "$FOUND" -eq 0 ] && echo "  OK" | tee -a "$LOG"

      - name: 7.5. Configurar Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle
            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi
          cd ..

      - name: 7.7. Diagnóstico
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.7 =====" | tee -a "$LOG"
          echo "Archivos en res/: $(find project/app/src/main/res -type f | wc -l)" | tee -a "$LOG"
          echo "Peso res/: $(du -sh project/app/src/main/res | cut -f1)" | tee -a "$LOG"

      - name: 7.9. Memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          cd ..

      # ============================================================
      # PASO 8 — COMPILAR (con diagnóstico automático si falla)
      # ============================================================
      - name: 8. Compilar
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8: GRADLE BUILD =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
          set +e
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "" | tee -a "$LOG"
            echo "===== DIAGNÓSTICO POST-FALLO =====" | tee -a "$LOG"

            VALUES="$GITHUB_WORKSPACE/project/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml"
            VALUES_HI="$GITHUB_WORKSPACE/project/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values-hi/values-hi.xml"

            if [ -f "$VALUES" ]; then
              echo "--- values.xml línea 12747 ±10 (¿qué hay ahí?) ---" | tee -a "$LOG"
              sed -n '12737,12757p' "$VALUES" | cat -A | tee -a "$LOG"
              echo "--- Buscando ]]> en values.xml merged ---" | tee -a "$LOG"
              grep -n ']]>' "$VALUES" | head -20 | tee -a "$LOG" || true
            else
              echo "(values.xml merged no existe)" | tee -a "$LOG"
            fi

            if [ -f "$VALUES_HI" ]; then
              echo "--- Buscando <plurals> sin quantity en values-hi.xml ---" | tee -a "$LOG"
              grep -n 'plurals\|<item' "$VALUES_HI" | head -40 | tee -a "$LOG" || true
            fi
          fi

          exit $RC

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
