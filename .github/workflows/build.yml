name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      - name: 6.5. Normalizar encoding
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          echo "===== STEP 6.5 =====" | tee -a "$LOG"
          RES="project/app/src/main/res"
          COUNT=0
          while IFS= read -r -d '' f; do
            ENC=$(file --mime-encoding -b "$f" 2>/dev/null || echo "unknown")
            case "$ENC" in
              utf-8|us-ascii|ascii|utf8) ;;
              *)
                if iconv -f "$ENC" -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                  mv "$f.tmp" "$f"; COUNT=$((COUNT+1))
                else rm -f "$f.tmp"; fi ;;
            esac
          done < <(find "$RES" -type f -name "*.xml" -print0)
          echo "Convertidos: $COUNT" | tee -a "$LOG"

      # ============================================================
      - name: 7. Corregir vectores
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          BASE = "project/app/src/main/res"
          DIRS = [d for d in os.listdir(BASE) if d.startswith("drawable")] if os.path.isdir(BASE) else []
          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )
          def lit(m): return f'{m.group(1)}="#FF000000"'
          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)
          fixed = 0
          for d in DIRS:
              for root, _, files in os.walk(os.path.join(BASE, d)):
                  for fn in files:
                      if not fn.lower().endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      src = open(p, encoding="utf-8", errors="replace").read()
                      orig = src
                      src = RE_REF.sub(lit, src)
                      m = RE_VEC_OPEN.search(src)
                      if m:
                          vec = m.group(0); fv = vec
                          wm = re.search(r'android:width\s*=\s*"([^"]*)"', vec)
                          if wm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', wm.group(1)):
                                  fv = fv[:wm.start(1)] + "24dp" + fv[wm.end(1):]
                          else: fv = fv[:-1] + ' android:width="24dp">'
                          hm = re.search(r'android:height\s*=\s*"([^"]*)"', vec)
                          if hm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', hm.group(1)):
                                  fv = fv[:hm.start(1)] + "24dp" + fv[hm.end(1):]
                          else: fv = fv[:-1] + ' android:height="24dp">'
                          if fv != vec: src = src.replace(vec, fv, 1)
                      if src != orig:
                          open(p, "w", encoding="utf-8").write(src)
                          fixed += 1
          print(f"Vectores corregidos: {fixed}")
          PYEOF

      # ============================================================
      - name: 7.2. Corregir strings y plurals
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.2 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"

          RE_PLURAL_BLOCK = re.compile(r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL)
          RE_PLURAL_NAMED = re.compile(
              r'<plurals\b[^>]*name="custom_gifts_guidelines_info_monthly_limit"[^>]*>.*?</plurals>\s*',
              re.DOTALL
          )
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)
          RE_ITEM_SELF = re.compile(r'<item(\s[^>]*)?/>', re.DOTALL)

          stats = {'gt': 0, 'pl_pair': 0, 'pl_self': 0, 'del': 0}

          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  try: src = open(p, encoding="utf-8", errors="replace").read()
                  except: continue
                  orig = src

                  # 1) Eliminar ]]> y ]]&gt;
                  if ']]>' in src:
                      src = src.replace(']]>', '')
                      stats['gt'] += 1
                  if ']]&gt;' in src:
                      src = src.replace(']]&gt;', '')
                      stats['gt'] += 1

                  # 2) Eliminar el plural problemático concreto
                  if 'custom_gifts_guidelines_info_monthly_limit' in src:
                      new = RE_PLURAL_NAMED.sub('', src)
                      if new != src:
                          print(f"[DEL plural] {p}")
                          src = new
                          stats['del'] += 1

                  # 3) Fix items en plurals (pair + self-closing)
                  def repl_block(m):
                      block = m.group(0)
                      he = block.find('>') + 1
                      ts = block.rfind('</plurals>')
                      if he <= 0 or ts <= 0: return block
                      head, body, tail = block[:he], block[he:ts], block[ts:]
                      def fx_self(im):
                          attrs = im.group(1) or ''
                          if 'quantity' in attrs: return im.group(0)
                          stats['pl_self'] += 1
                          return f'<item quantity="other"{attrs}/>'
                      def fx_pair(im):
                          attrs = im.group(1) or ''
                          if 'quantity' in attrs: return im.group(0)
                          stats['pl_pair'] += 1
                          return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                      body = RE_ITEM_SELF.sub(fx_self, body)
                      body = RE_ITEM.sub(fx_pair, body)
                      return head + body + tail
                  src = RE_PLURAL_BLOCK.sub(repl_block, src)

                  if src != orig:
                      open(p, "w", encoding="utf-8").write(src)

          print(f"]]> eliminados: {stats['gt']}")
          print(f"<item>...</item> corregidos: {stats['pl_pair']}")
          print(f"<item/> self-closing corregidos: {stats['pl_self']}")
          print(f"<plurals> problemáticos eliminados: {stats['del']}")
          PYEOF

      - name: 7.3. Eliminar .9.png corruptos
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.3 =====" | tee -a "$LOG"
          find project/app/src/main/res -name "*.9.png" -type f -delete 2>&1 | tee -a "$LOG" || true
          echo "Restantes: $(find project/app/src/main/res -name '*.9.png' -type f 2>/dev/null | wc -l)" | tee -a "$LOG"

      - name: 7.4. Verificación source
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.4 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"
          gt, pl = [], []
          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  src = open(p, encoding="utf-8", errors="replace").read()
                  if ']]>' in src or ']]&gt;' in src: gt.append(p)
                  for m in re.finditer(r'<plurals\b[^>]*>(.*?)</plurals>', src, re.DOTALL):
                      for im in re.finditer(r'<item(\s[^>]*)?/?>', m.group(1)):
                          if 'quantity' not in (im.group(1) or ''):
                              pl.append((p, im.group(0)[:80]))
          print(f"]]> / ]]&gt; en source: {len(gt)}")
          for p in gt[:20]: print(f"  {p}")
          print(f"plurals sin quantity en source: {len(pl)}")
          for p, frag in pl[:20]: print(f"  {p}: {frag}")
          print("OK source" if not gt and not pl else "WARN source")
          PYEOF

      - name: 7.5. Configurar Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle
            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi
          cd ..

      - name: 7.7. Diagnóstico
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.7 =====" | tee -a "$LOG"
          echo "Archivos en res/: $(find project/app/src/main/res -type f | wc -l)" | tee -a "$LOG"
          echo "Peso res/: $(du -sh project/app/src/main/res | cut -f1)" | tee -a "$LOG"

      - name: 7.9. Memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          cd ..

      # ============================================================
      # PASO 8 — PRE-BUILD para poblar cache
      # ============================================================
      - name: 8.1. Pre-build para poblar cache de AARs
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.1: PRE-BUILD =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
          set +e
          "$G" --no-daemon --stacktrace :app:mergeDebugResources 2>&1 | tail -30 | tee -a "$LOG"
          set -e
          echo "Pre-build completado (aunque haya fallado, cache está poblada)" | tee -a "$LOG"

      # ============================================================
      # PASO 8.2 — PATCH AARs EN CACHE
      # ============================================================
      - name: 8.2. Patch AARs y transforms de Gradle cache
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.2: PATCH AARs =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re, zipfile, glob

          HOME = os.path.expanduser("~")
          CACHE = os.path.join(HOME, ".gradle", "caches")
          if not os.path.isdir(CACHE):
              print("No hay cache"); raise SystemExit(0)

          RE_PLURAL = re.compile(r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL)
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)
          RE_ITEM_SELF = re.compile(r'<item(\s[^>]*)?/>')

          def fix_xml(text):
              orig = text
              text = text.replace(']]>', '')
              text = text.replace(']]&gt;', '')
              def repl_block(m):
                  block = m.group(0)
                  he = block.find('>') + 1
                  ts = block.rfind('</plurals>')
                  if he <= 0 or ts <= 0: return block
                  head, body, tail = block[:he], block[he:ts], block[ts:]
                  def fx_self(im):
                      attrs = im.group(1) or ''
                      if 'quantity' in attrs: return im.group(0)
                      return f'<item quantity="other"{attrs}/>'
                  def fx_pair(im):
                      attrs = im.group(1) or ''
                      if 'quantity' in attrs: return im.group(0)
                      return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                  body = RE_ITEM_SELF.sub(fx_self, body)
                  body = RE_ITEM.sub(fx_pair, body)
                  return head + body + tail
              text = RE_PLURAL.sub(repl_block, text)
              return text, text != orig

          total = 0

          # 1. Transforms (extraídos)
          for tdir in glob.glob(os.path.join(CACHE, "transforms-*")):
              for root, _, files in os.walk(tdir):
                  rp = root.replace("\\", "/")
                  if "/transformed/" not in rp: continue
                  if "/res/values" not in rp: continue
                  for fn in files:
                      if not fn.endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      try:
                          text = open(p, encoding="utf-8", errors="replace").read()
                          t2, ch = fix_xml(text)
                          if ch:
                              open(p, "w", encoding="utf-8").write(t2)
                              print(f"[TRANSFORM] {p}")
                              total += 1
                      except: pass

          # 2. AARs originales
          for aar in glob.glob(os.path.join(CACHE, "modules-2", "**", "*.aar"), recursive=True):
              try:
                  with zipfile.ZipFile(aar, 'r') as zin:
                      changes = {}
                      for name in zin.namelist():
                          if not name.endswith(".xml"): continue
                          if "/res/values" not in name: continue
                          data = zin.read(name).decode("utf-8", errors="replace")
                          nd, ch = fix_xml(data)
                          if ch:
                              changes[name] = nd
                              print(f"[AAR] {aar}::{name}")
                              total += 1
                      if changes:
                          tmp = aar + ".patched"
                          with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                              for item in zin.infolist():
                                  if item.filename in changes:
                                      zout.writestr(item, changes[item.filename])
                                  else:
                                      zout.writestr(item, zin.read(item.filename))
                          os.replace(tmp, aar)
              except: pass

          print(f"Total parcheados: {total}")
          PYEOF

      # ============================================================
      # PASO 8.3 — BUILD FINAL
      # ============================================================
      - name: 8.3. Build final
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.3: BUILD FINAL =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
          set +e
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "" | tee -a "$LOG"
            echo "===== DIAGNÓSTICO POST-FALLO =====" | tee -a "$LOG"
            MERGED="app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir"
            for f in "$MERGED/values/values.xml" "$MERGED/values-hi/values-hi.xml"; do
              if [ -f "$f" ]; then
                echo "--- $f: <plurals> con <item> sin quantity ---" | tee -a "$LOG"
                python3 - "$f" <<'PY' 2>&1 | tee -a "$LOG"
          import sys, re
          src = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'<plurals\b[^>]*>.*?</plurals>', src, re.DOTALL):
              block = m.group(0)
              nm = re.search(r'name="([^"]*)"', block)
              name = nm.group(1) if nm else '?'
              for im in re.finditer(r'<item(\s[^>]*)?/?>', block):
                  if 'quantity' not in (im.group(1) or ''):
                      print(f"  [BAD] plurals={name}: {im.group(0)[:100]}")
          PY
              fi
            done
          fi

          exit $RC

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
