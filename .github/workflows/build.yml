name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          echo "Estructura:"
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # PASO 7 — VECTORES con Python (añade width/height, resuelve refs)
      # ============================================================
      - name: 7. Corregir vectores con Python
        shell: bash
        run: |
          set -e
          python3 - <<'PYEOF'
          import os, re

          RES = "project/app/src/main/res/drawable"
          if not os.path.isdir(RES):
              print("No hay carpeta drawable"); raise SystemExit(0)

          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )
          def lit(m):
              return f'{m.group(1)}="#FF000000"'

          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)

          for fn in os.listdir(RES):
              if not fn.endswith(".xml"):
                  continue
              path = os.path.join(RES, fn)
              with open(path, "r", encoding="utf-8", errors="replace") as f:
                  src = f.read()
              orig = src

              # 1) Resolver referencias simbólicas
              src = RE_REF.sub(lit, src)

              # 2) Asegurar width/height válidos en <vector>
              m = RE_VEC_OPEN.search(src)
              if m:
                  vec = m.group(0)
                  fixed = vec

                  if not re.search(r'android:width\s*=\s*"([1-9][0-9]*)', vec):
                      if re.search(r'android:width\s*=\s*"', vec):
                          fixed = re.sub(r'android:width\s*=\s*"[^"]*"',
                                         'android:width="24dp"', fixed)
                      else:
                          fixed = fixed[:-1] + ' android:width="24dp">'

                  if not re.search(r'android:height\s*=\s*"([1-9][0-9]*)', vec):
                      if re.search(r'android:height\s*=\s*"', vec):
                          fixed = re.sub(r'android:height\s*=\s*"[^"]*"',
                                         'android:height="24dp"', fixed)
                      else:
                          fixed = fixed[:-1] + ' android:height="24dp">'

                  if fixed != vec:
                      src = src.replace(vec, fixed, 1)

              if src != orig:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(src)
                  print(f"[vector] Corregido: {fn}")

          print("Vectores OK.")
          PYEOF

      # ============================================================
      # PASO 7.2 — STRINGS/PLURALS con Python
      # ============================================================
      - name: 7.2. Corregir strings/plurals con Python
        shell: bash
        run: |
          set -e
          python3 - <<'PYEOF'
          import os, re

          RES = "project/app/src/main/res"

          def fix_cdata_literals(text):
              """Escapa ]]> que NO cierra una CDATA."""
              out = []
              i = 0
              n = len(text)
              while i < n:
                  if text.startswith("<![CDATA[", i):
                      j = text.find("]]>", i + 9)
                      if j == -1:
                          out.append(text[i:].replace("]]>", "]]&gt;"))
                          break
                      out.append(text[i:j+3])
                      i = j + 3
                  else:
                      j = text.find("]]>", i)
                      if j == -1:
                          out.append(text[i:])
                          break
                      out.append(text[i:j])
                      out.append("]]&gt;")
                      i = j + 3
              return "".join(out)

          RE_PLURAL = re.compile(r'(<plurals\b[^>]*>)(.*?)(</plurals>)', re.DOTALL)
          RE_ITEM_BARE = re.compile(r'<item\s*>([^<]*)</item>')

          def fix_plural_block(m):
              head, body, tail = m.group(1), m.group(2), m.group(3)
              body = RE_ITEM_BARE.sub(
                  lambda x: f'<item quantity="other">{x.group(1)}</item>',
                  body
              )
              return head + body + tail

          fixed_files = []
          for root, _, files in os.walk(RES):
              for fn in files:
                  if not fn.endswith(".xml"):
                      continue
                  path = os.path.join(root, fn)
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      src = f.read()
                  orig = src

                  src = fix_cdata_literals(src)
                  src = RE_PLURAL.sub(fix_plural_block, src)

                  if src != orig:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(src)
                      fixed_files.append(path)
                      print(f"[strings] Corregido: {path}")

          if not fixed_files:
              print("Nada que corregir en strings.")
          print("Strings OK.")
          PYEOF

      # ============================================================
      # PASO 7.3 — Verificación estricta
      # ============================================================
      - name: 7.3. Verificación de recursos
        shell: bash
        run: |
          set +e
          RES="project/app/src/main/res"

          echo "== Vectores con referencias simbólicas =="
          grep -rEl '(strokeColor|fillColor)="(@color/|@drawable/|\?attr/)' \
            "$RES/drawable/" 2>/dev/null || echo "OK"

          echo "== Vectores con width/height 0 =="
          grep -rEl 'android:(width|height)="0' "$RES/drawable/" 2>/dev/null || echo "OK"

          echo "== <item> sin quantity en strings =="
          grep -rn '<item>' "$RES"/values*/strings.xml 2>/dev/null || echo "OK"

          echo "Verificación terminada."

      # ============================================================
      # PASO 7.4 — Validar XML con xmllint
      # ============================================================
      - name: 7.4. Validar XML de recursos
        shell: bash
        run: |
          set -e
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          fi
          RES="project/app/src/main/res"
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! xmllint --noout "$f" 2>/dev/null; then
              echo "::error file=$f::XML inválido"
              xmllint --noout "$f" 2>&1 || true
              FAILED=1
            fi
          done < <(find "$RES" -type f -name "*.xml" -print0)
          if [ "$FAILED" -eq 1 ]; then
            echo "Hay XML mal formados. Abortando antes de Gradle."
            exit 1
          fi
          echo "OK: todos los XML son válidos."

      - name: 7.5. Forzar configuración correcta de Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project

          echo "Generando un settings.gradle robusto..."
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          echo "Asegurando que el plugin en app/build.gradle tenga la versión correcta..."
          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle

            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi

          cd ..

      - name: 7.7. Diagnóstico de recursos
        shell: bash
        run: |
          echo "Cantidad de archivos en res/:"
          find project/app/src/main/res -type f 2>/dev/null | wc -l || true
          echo "Peso de res/:"
          du -sh project/app/src/main/res 2>/dev/null || true
          echo "Primeras líneas de app/build.gradle:"
          head -30 project/app/build.gradle 2>/dev/null || true

      - name: 7.9. Configurar memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          echo "gradle.properties generado:"
          cat gradle.properties
          cd ..

      - name: 8. Compilar
        shell: bash
        run: |
          set -o pipefail
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
