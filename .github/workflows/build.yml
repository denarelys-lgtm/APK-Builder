name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # PASO 6.5 — NORMALIZAR ENCODING
      # ============================================================
      - name: 6.5. Normalizar encoding de XML
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          echo "===== STEP 6.5 =====" | tee -a "$LOG"
          RES="project/app/src/main/res"
          COUNT=0
          while IFS= read -r -d '' f; do
            ENC=$(file --mime-encoding -b "$f" 2>/dev/null || echo "unknown")
            case "$ENC" in
              utf-8|us-ascii|ascii|utf8) ;;
              *)
                if iconv -f "$ENC" -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                  mv "$f.tmp" "$f"; COUNT=$((COUNT+1))
                else
                  rm -f "$f.tmp"
                  if iconv -f UTF-16 -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                    mv "$f.tmp" "$f"; COUNT=$((COUNT+1))
                  else
                    rm -f "$f.tmp"
                  fi
                fi
                ;;
            esac
          done < <(find "$RES" -type f -name "*.xml" -print0)
          echo "Convertidos: $COUNT" | tee -a "$LOG"

      # ============================================================
      # PASO 7 — VECTORES
      # ============================================================
      - name: 7. Corregir vectores
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7: VECTORES =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          BASE = "project/app/src/main/res"
          DIRS = [d for d in os.listdir(BASE) if d.startswith("drawable")] if os.path.isdir(BASE) else []
          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )
          def lit(m): return f'{m.group(1)}="#FF000000"'
          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)
          fixed = 0
          for d in DIRS:
              full = os.path.join(BASE, d)
              for root, _, files in os.walk(full):
                  for fn in files:
                      if not fn.lower().endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      with open(p, "r", encoding="utf-8", errors="replace") as f:
                          src = f.read()
                      orig = src
                      src = RE_REF.sub(lit, src)
                      m = RE_VEC_OPEN.search(src)
                      if m:
                          vec = m.group(0); fixedv = vec
                          wm = re.search(r'android:width\s*=\s*"([^"]*)"', vec)
                          if wm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', wm.group(1)):
                                  fixedv = fixedv[:wm.start(1)] + "24dp" + fixedv[wm.end(1):]
                          else:
                              fixedv = fixedv[:-1] + ' android:width="24dp">'
                          hm = re.search(r'android:height\s*=\s*"([^"]*)"', vec)
                          if hm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', hm.group(1)):
                                  fixedv = fixedv[:hm.start(1)] + "24dp" + fixedv[hm.end(1):]
                          else:
                              fixedv = fixedv[:-1] + ' android:height="24dp">'
                          if fixedv != vec:
                              src = src.replace(vec, fixedv, 1)
                      if src != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(src)
                          fixed += 1
          print(f"Vectores corregidos: {fixed}")
          PYEOF

      # ============================================================
      # PASO 7.2 — STRINGS / PLURALS: FIX AGRESIVO
      # - Elimina ]]> y ]]&gt; (AAPT2 bug con plurals)
      # - Corrige <item> sin quantity en <plurals>
      # - Elimina el plural custom_gifts_guidelines_info_monthly_limit
      # ============================================================
      - name: 7.2. Corregir strings y plurals
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.2: FIX AGRESIVO =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"

          RE_PLURAL_BLOCK = re.compile(r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL)
          RE_PLURAL_NAMED = re.compile(
              r'<plurals\b[^>]*name="custom_gifts_guidelines_info_monthly_limit"[^>]*>.*?</plurals>\s*',
              re.DOTALL
          )
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)

          stats = {'gt': 0, 'pl': 0, 'del': 0}

          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  try:
                      src = open(p, encoding="utf-8", errors="replace").read()
                  except Exception as e:
                      print(f"[ERR] {p}: {e}"); continue
                  orig = src

                  # 1) Eliminar secuencias ]]> (literal y escapada)
                  if ']]>' in src:
                      src = src.replace(']]>', '')
                      stats['gt'] += 1
                  if ']]&gt;' in src:
                      src = src.replace(']]&gt;', '')
                      stats['gt'] += 1

                  # 2) Eliminar bloque <plurals> con el nombre problemático
                  if 'custom_gifts_guidelines_info_monthly_limit' in src:
                      new = RE_PLURAL_NAMED.sub('', src)
                      if new != src:
                          print(f"[DEL plural] {p}")
                          src = new
                          stats['del'] += 1

                  # 3) Corregir <item> sin quantity dentro de <plurals>
                  def repl_plural(m):
                      head, body, tail = m.group(1), m.group(2), m.group(3)
                      def fx(im):
                          attrs = im.group(1) or ""
                          if 'quantity' in attrs: return im.group(0)
                          return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                      return head + RE_ITEM.sub(fx, body) + tail
                  # Nota: usamos RE_PLURAL_BLOCK sin captura por compatibilidad
                  def repl_block(m):
                      block = m.group(0)
                      head_end = block.find('>') + 1
                      tail_start = block.rfind('</plurals>')
                      if head_end <= 0 or tail_start <= 0: return block
                      head = block[:head_end]
                      body = block[head_end:tail_start]
                      tail = block[tail_start:]
                      def fx(im):
                          attrs = im.group(1) or ""
                          if 'quantity' in attrs: return im.group(0)
                          return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                      return head + RE_ITEM.sub(fx, body) + tail
                  new = RE_PLURAL_BLOCK.sub(repl_block, src)
                  if new != src:
                      stats['pl'] += 1
                      src = new

                  if src != orig:
                      open(p, "w", encoding="utf-8").write(src)

          print(f"]]> eliminados: {stats['gt']}")
          print(f"<item> sin quantity corregidos: {stats['pl']}")
          print(f"<plurals> problemáticos eliminados: {stats['del']}")
          PYEOF

      # ============================================================
      # PASO 7.3 — ELIMINAR .9.png
      # ============================================================
      - name: 7.3. Eliminar .9.png corruptos
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.3 =====" | tee -a "$LOG"
          find project/app/src/main/res -name "*.9.png" -type f -delete 2>&1 | tee -a "$LOG" || true
          echo "Restantes: $(find project/app/src/main/res -name '*.9.png' -type f 2>/dev/null | wc -l)" | tee -a "$LOG"

      # ============================================================
      # PASO 7.4 — VERIFICACIÓN (busca también ]]&gt;)
      # ============================================================
      - name: 7.4. Verificación estricta
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.4 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"
          gt, pl = [], []
          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  src = open(p, encoding="utf-8", errors="replace").read()
                  if ']]>' in src or ']]&gt;' in src:
                      gt.append(p)
                  for m in re.finditer(r'<plurals\b[^>]*>(.*?)</plurals>', src, re.DOTALL):
                      for im in re.finditer(r'<item(\s[^>]*)?>', m.group(1)):
                          if 'quantity' not in (im.group(1) or ''):
                              pl.append((p, im.group(0)[:80]))
          print(f"]]> / ]]&gt; en source: {len(gt)}")
          for p in gt[:20]: print(f"  {p}")
          print(f"plurals sin quantity en source: {len(pl)}")
          for p, frag in pl[:20]: print(f"  {p}: {frag}")
          print("OK source" if not gt and not pl else "WARN source")
          PYEOF

      - name: 7.5. Configurar Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle
            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi
          cd ..

      - name: 7.7. Diagnóstico
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.7 =====" | tee -a "$LOG"
          echo "Archivos en res/: $(find project/app/src/main/res -type f | wc -l)" | tee -a "$LOG"
          echo "Peso res/: $(du -sh project/app/src/main/res | cut -f1)" | tee -a "$LOG"

      - name: 7.9. Memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          cd ..

      - name: 8. Compilar
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8: GRADLE BUILD =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

          set +e
          "$G" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "" | tee -a "$LOG"
            echo "===== DIAGNÓSTICO POST-FALLO =====" | tee -a "$LOG"
            MERGED="app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir"
            for f in "$MERGED/values/values.xml" "$MERGED/values-hi/values-hi.xml"; do
              if [ -f "$f" ]; then
                echo "--- $f ---" | tee -a "$LOG"
                echo "  ]]> residuales:" | tee -a "$LOG"
                grep -n ']]>' "$f" | head -10 | tee -a "$LOG" || echo "  (ninguno)" | tee -a "$LOG"
                echo "  <item> sin quantity:" | tee -a "$LOG"
                grep -n '<item>' "$f" | head -10 | tee -a "$LOG" || echo "  (ninguno)" | tee -a "$LOG"
              fi
            done
          fi

          exit $RC

      - name: 9. Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
