
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 6.5. Normalizar encoding
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          echo "===== STEP 6.5 =====" | tee -a "$LOG"
          RES="project/app/src/main/res"
          COUNT=0

          while IFS= read -r -d '' f; do
            ENC=$(file --mime-encoding -b "$f" 2>/dev/null || echo "unknown")
            case "$ENC" in
              utf-8|us-ascii|ascii|utf8) ;;
              *)
                if iconv -f "$ENC" -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                  mv "$f.tmp" "$f"
                  COUNT=$((COUNT+1))
                else
                  rm -f "$f.tmp"
                fi
                ;;
            esac
          done < <(find "$RES" -type f -name "*.xml" -print0)

          echo "Convertidos: $COUNT" | tee -a "$LOG"

      - name: 7. Corregir vectores
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7 =====" | tee -a "$LOG"

          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re

          BASE = "project/app/src/main/res"
          DIRS = [
              d for d in os.listdir(BASE)
              if d.startswith("drawable")
          ] if os.path.isdir(BASE) else []

          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )

          def lit(m):
              return f'{m.group(1)}="#FF000000"'

          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)
          fixed = 0

          for d in DIRS:
              for root, _, files in os.walk(os.path.join(BASE, d)):
                  for fn in files:
                      if not fn.lower().endswith(".xml"):
                          continue

                      p = os.path.join(root, fn)
                      with open(p, encoding="utf-8", errors="replace") as f:
                          src = f.read()

                      orig = src
                      src = RE_REF.sub(lit, src)
                      m = RE_VEC_OPEN.search(src)

                      if m:
                          vec = m.group(0)
                          fv = vec

                          wm = re.search(r'android:width\s*=\s*"([^"]*)"', vec)
                          if wm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', wm.group(1)):
                                  fv = fv[:wm.start(1)] + "24dp" + fv[wm.end(1):]
                          else:
                              fv = fv[:-1] + ' android:width="24dp">'

                          hm = re.search(r'android:height\s*=\s*"([^"]*)"', fv)
                          if hm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', hm.group(1)):
                                  fv = fv[:hm.start(1)] + "24dp" + fv[hm.end(1):]
                          else:
                              fv = fv[:-1] + ' android:height="24dp">'

                          if fv != vec:
                              src = src.replace(vec, fv, 1)

                      if src != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(src)
                          fixed += 1

          print(f"Vectores corregidos: {fixed}")
          PYEOF

      - name: 7.2. Corregir strings y plurals
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.2 =====" | tee -a "$LOG"

          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re

          RES = "project/app/src/main/res"
          RE_PLURAL_BLOCK = re.compile(
              r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL
          )
          RE_PLURAL_NAMED = re.compile(
              r'<plurals\b[^>]*name="custom_gifts_guidelines_info_monthly_limit"[^>]*>.*?</plurals>\s*',
              re.DOTALL
          )
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)
          RE_ITEM_SELF = re.compile(r'<item(\s[^>]*)?/>', re.DOTALL)

          stats = {'gt': 0, 'pl_pair': 0, 'pl_self': 0, 'del': 0}

          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"):
                  continue

              for fn in files:
                  if not fn.lower().endswith(".xml"):
                      continue

                  p = os.path.join(root, fn)
                  try:
                      with open(p, encoding="utf-8", errors="replace") as f:
                          src = f.read()
                  except Exception:
                      continue

                  orig = src

                  if ']]>' in src:
                      src = src.replace(']]>', '')
                      stats['gt'] += 1

                  if ']]&gt;' in src:
                      src = src.replace(']]&gt;', '')
                      stats['gt'] += 1

                  if 'custom_gifts_guidelines_info_monthly_limit' in src:
                      new = RE_PLURAL_NAMED.sub('', src)
                      if new != src:
                          print(f"[DEL plural] {p}")
                          src = new
                          stats['del'] += 1

                  def repl_block(m):
                      block = m.group(0)
                      he = block.find('>') + 1
                      ts = block.rfind('</plurals>')

                      if he <= 0 or ts <= 0:
                          return block

                      head, body, tail = block[:he], block[he:ts], block[ts:]

                      def fx_self(im):
                          attrs = im.group(1) or ''
                          if re.search(r'\bquantity\s*=', attrs):
                              return im.group(0)
                          stats['pl_self'] += 1
                          return f'<item quantity="other"{attrs}/>'

                      def fx_pair(im):
                          attrs = im.group(1) or ''
                          if re.search(r'\bquantity\s*=', attrs):
                              return im.group(0)
                          stats['pl_pair'] += 1
                          return f'<item quantity="other"{attrs}>{im.group(2)}</item>'

                      body = RE_ITEM_SELF.sub(fx_self, body)
                      body = RE_ITEM.sub(fx_pair, body)
                      return head + body + tail

                  src = RE_PLURAL_BLOCK.sub(repl_block, src)

                  if src != orig:
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(src)

          print(f"]]> eliminados: {stats['gt']}")
          print(f"<item>...</item> corregidos: {stats['pl_pair']}")
          print(f"<item/> corregidos: {stats['pl_self']}")
          print(f"<plurals> eliminados: {stats['del']}")
          PYEOF

      - name: 7.3. Eliminar .9.png corruptos
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.3 =====" | tee -a "$LOG"
          find project/app/src/main/res -name "*.9.png" -type f -delete 2>&1 | tee -a "$LOG" || true
          echo "Restantes: $(find project/app/src/main/res -name '*.9.png' -type f 2>/dev/null | wc -l)" | tee -a "$LOG"

      - name: 7.4. Verificación source
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.4 =====" | tee -a "$LOG"

          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os
          import xml.etree.ElementTree as ET

          RES = "project/app/src/main/res"
          invalid = []
          missing_quantity = []

          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"):
                  continue

              for fn in files:
                  if not fn.lower().endswith(".xml"):
                      continue

                  p = os.path.join(root, fn)
                  try:
                      tree = ET.parse(p)
                      xmlroot = tree.getroot()
                  except Exception as e:
                      invalid.append((p, str(e)))
                      continue

                  for plural in xmlroot.iter("plurals"):
                      for item in list(plural):
                          if item.tag.split("}")[-1] == "item":
                              if not item.get("quantity"):
                                  missing_quantity.append(
                                      (p, plural.get("name"), ET.tostring(item, encoding="unicode"))
                                  )

          print(f"XML fuente inválidos: {len(invalid)}")
          for p, err in invalid[:100]:
              print(f"[INVALID_XML] {p}: {err}")

          print(f"Items de plurals sin quantity: {len(missing_quantity)}")
          for p, name, item in missing_quantity[:100]:
              print(f"[MISSING_QUANTITY] {p} plurals={name}: {item}")
          PYEOF

      - name: 7.5. Configurar Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle

            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi
          cd ..

      - name: 7.7. Diagnóstico inicial
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.7 =====" | tee -a "$LOG"
          echo "Archivos en res/: $(find project/app/src/main/res -type f | wc -l)" | tee -a "$LOG"
          echo "Peso res/: $(du -sh project/app/src/main/res | cut -f1)" | tee -a "$LOG"

      - name: 7.9. Memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          cd ..

      - name: 8.1. Pre-build para poblar cache
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.1: PRE-BUILD =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

          set +e
          "$G" --no-daemon --stacktrace :app:mergeDebugResources 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          echo "Pre-build terminó con código: $RC" | tee -a "$LOG"
          exit 0

      - name: 8.2. Inspeccionar XML de AARs en caché
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.2: INSPECCION AAR =====" | tee -a "$LOG"

          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, glob, zipfile
          import xml.etree.ElementTree as ET

          cache = os.path.expanduser("~/.gradle/caches")
          count = 0

          for aar in glob.glob(os.path.join(cache, "modules-2", "**", "*.aar"), recursive=True):
              try:
                  with zipfile.ZipFile(aar) as z:
                      for name in z.namelist():
                          if not name.endswith(".xml") or "/res/values" not in name:
                              continue
                          try:
                              data = z.read(name)
                              root = ET.fromstring(data)
                          except Exception as e:
                              print(f"[AAR_XML_INVALID] {aar} :: {name} :: {e}")
                              continue

                          for plural in root.iter("plurals"):
                              for item in list(plural):
                                  if item.tag.split("}")[-1] == "item" and not item.get("quantity"):
                                      print(
                                          f"[AAR_PLURAL_MISSING_QUANTITY] {aar} :: {name} "
                                          f"plural={plural.get('name')!r}"
                                      )
                                      count += 1
              except Exception as e:
                  print(f"[AAR_READ_ERROR] {aar}: {e}")

          print(f"Total de items de plurals sospechosos encontrados en AAR: {count}")
          PYEOF

      - name: 8.3. Build final y diagnóstico forense
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          REPORT="$GITHUB_WORKSPACE/resource-forensics.txt"
          echo "===== STEP 8.3: BUILD FINAL =====" | tee -a "$LOG"

          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

          set +e
          "$G" --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            cd "$GITHUB_WORKSPACE"

            {
              echo "=================================================="
              echo "DIAGNOSTICO FORENSE DE RECURSOS ANDROID"
              echo "Fecha UTC: $(date -u)"
              echo "Codigo de salida Gradle: $RC"
              echo "=================================================="

              python3 - <<'PYEOF'
          import os
          import glob
          import xml.etree.ElementTree as ET

          ROOT = "project/app/src/main/res"
          BUILD = "project/app/build/intermediates"
          inspected = set()

          def inspect(path, origin):
              ap = os.path.abspath(path)
              if ap in inspected or not os.path.isfile(path):
                  return
              inspected.add(ap)

              try:
                  with open(path, encoding="utf-8", errors="replace") as f:
                      data = f.read()
              except Exception as e:
                  print(f"[READ_ERROR] {path}: {e}")
                  return

              print(f"\n===== XML [{origin}]: {path} =====")

              try:
                  root = ET.fromstring(data)
              except Exception as e:
                  print(f"[INVALID_XML] {e}")
                  for n, line in enumerate(data.splitlines(), 1):
                      if any(x in line for x in (
                          "<plurals", "</plurals>", "<item", "xliff:g",
                          "<![CDATA[", "]]>", "]]&gt;"
                      )):
                          print(f"  LINE {n}: {line.strip()[:700]}")
                  return

              for node in root.iter():
                  if node.tag.split("}")[-1] != "plurals":
                      continue

                  name = node.get("name")
                  print(f"[PLURALS] name={name!r}")

                  if not name:
                      print("  [ERROR] plurals sin atributo name")

                  for child in list(node):
                      tag = child.tag.split("}")[-1]

                      if tag != "item":
                          print(f"  [UNEXPECTED_CHILD] tag={tag!r} attrs={dict(child.attrib)!r}")
                          continue

                      quantity = child.get("quantity")

                      if not quantity:
                          print(f"  [MISSING_QUANTITY] attrs={dict(child.attrib)!r}")
                          print("  [ITEM_XML]", ET.tostring(child, encoding="unicode")[:1000])
                      elif quantity not in ("zero", "one", "two", "few", "many", "other"):
                          print(f"  [INVALID_QUANTITY] {quantity!r}")

                      for nested in child.iter():
                          if nested is child:
                              continue
                          ntag = nested.tag.split("}")[-1]
                          if ntag in ("g", "xliff:g"):
                              print(f"  [NESTED_TAG] tag={ntag!r} attrs={dict(nested.attrib)!r}")

          if os.path.isdir(ROOT):
              for base, dirs, files in os.walk(ROOT):
                  if not os.path.basename(base).startswith("values"):
                      continue
                  for fn in files:
                      if fn.endswith(".xml"):
                          inspect(os.path.join(base, fn), "SOURCE")

          patterns = [
              os.path.join(BUILD, "**", "merged.dir", "values", "*.xml"),
              os.path.join(BUILD, "**", "merged.dir", "values-*", "*.xml"),
              os.path.join(BUILD, "**", "merged_res", "values", "*.xml"),
              os.path.join(BUILD, "**", "merged_res", "values-*", "*.xml"),
          ]

          for pattern in patterns:
              for path in sorted(glob.glob(pattern, recursive=True)):
                  inspect(path, "MERGED")

          print("\n===== FIN DEL DIAGNOSTICO =====")
          PYEOF
            } 2>&1 | tee "$REPORT" | tee -a "$LOG"

            echo "===== ARCHIVOS DE RECURSOS COMBINADOS =====" | tee -a "$LOG"
            find project/app/build/intermediates \
              -type f \( -name "values.xml" -o -name "values-*.xml" \) \
              2>/dev/null | head -200 | tee -a "$LOG" || true

            echo "===== CONTEXTO DEL ERROR AAPT/GRADLE =====" | tee -a "$LOG"
            grep -n -B 10 -A 20 -E \
              "ResourceCompilationException|TableExtractor|AAPT: error|error:" \
              "$LOG" | tail -250 | tee -a "$LOG" || true
          fi

          exit "$RC"

      - name: 9. Subir logs y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            resource-forensics.txt
            project/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/
            project/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values-hi/
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
