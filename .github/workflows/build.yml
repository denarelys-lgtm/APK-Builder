name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: 1. Descargar rebuild1.zip
        shell: bash
        run: |
          set -e
          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          curl -fsSL "$URL" -o rebuild1.zip
          ls -lh rebuild1.zip

      - name: 2. Descomprimir
        shell: bash
        run: |
          set -e
          mkdir project
          unzip -q rebuild1.zip -d project
          ls -la project/

      - name: 3. Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Android SDK
        uses: android-actions/setup-android@v4

      - name: 5. Componentes SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      - name: 6.5. Normalizar encoding
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          echo "===== STEP 6.5 =====" | tee -a "$LOG"
          RES="project/app/src/main/res"
          COUNT=0
          while IFS= read -r -d '' f; do
            ENC=$(file --mime-encoding -b "$f" 2>/dev/null || echo "unknown")
            case "$ENC" in
              utf-8|us-ascii|ascii|utf8) ;;
              *)
                if iconv -f "$ENC" -t UTF-8 "$f" -o "$f.tmp" 2>/dev/null; then
                  mv "$f.tmp" "$f"; COUNT=$((COUNT+1))
                else rm -f "$f.tmp"; fi ;;
            esac
          done < <(find "$RES" -type f -name "*.xml" -print0)
          echo "Convertidos: $COUNT" | tee -a "$LOG"

      # ============================================================
      - name: 7. Corregir vectores
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          BASE = "project/app/src/main/res"
          DIRS = [d for d in os.listdir(BASE) if d.startswith("drawable")] if os.path.isdir(BASE) else []
          RE_REF = re.compile(
              r'(strokeColor|fillColor|color)\s*=\s*"'
              r'(@color/|@android:color/|@drawable/|\?attr/|\?android:attr/)'
              r'[^"]*"'
          )
          def lit(m): return f'{m.group(1)}="#FF000000"'
          RE_VEC_OPEN = re.compile(r'<vector\b[^>]*>', re.DOTALL)
          fixed = 0
          for d in DIRS:
              for root, _, files in os.walk(os.path.join(BASE, d)):
                  for fn in files:
                      if not fn.lower().endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      src = open(p, encoding="utf-8", errors="replace").read()
                      orig = src
                      src = RE_REF.sub(lit, src)
                      m = RE_VEC_OPEN.search(src)
                      if m:
                          vec = m.group(0); fv = vec
                          wm = re.search(r'android:width\s*=\s*"([^"]*)"', vec)
                          if wm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', wm.group(1)):
                                  fv = fv[:wm.start(1)] + "24dp" + fv[wm.end(1):]
                          else: fv = fv[:-1] + ' android:width="24dp">'
                          hm = re.search(r'android:height\s*=\s*"([^"]*)"', vec)
                          if hm:
                              if not re.match(r'[1-9][0-9]*(dp|dip|px|sp)?$', hm.group(1)):
                                  fv = fv[:hm.start(1)] + "24dp" + fv[hm.end(1):]
                          else: fv = fv[:-1] + ' android:height="24dp">'
                          if fv != vec: src = src.replace(vec, fv, 1)
                      if src != orig:
                          open(p, "w", encoding="utf-8").write(src)
                          fixed += 1
          print(f"Vectores corregidos: {fixed}")
          PYEOF

      # ============================================================
      - name: 7.2. Corregir strings y plurals
        shell: bash
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.2 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"

          RE_PLURAL_BLOCK = re.compile(r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL)
          RE_PLURAL_NAMED = re.compile(
              r'<plurals\b[^>]*name="custom_gifts_guidelines_info_monthly_limit"[^>]*>.*?</plurals>\s*',
              re.DOTALL
          )
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)
          RE_ITEM_SELF = re.compile(r'<item(\s[^>]*)?/>', re.DOTALL)

          stats = {'gt': 0, 'pl_pair': 0, 'pl_self': 0, 'del': 0}

          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  try: src = open(p, encoding="utf-8", errors="replace").read()
                  except: continue
                  orig = src

                  # 1) Eliminar ]]> y ]]&gt;
                  if ']]>' in src:
                      src = src.replace(']]>', '')
                      stats['gt'] += 1
                  if ']]&gt;' in src:
                      src = src.replace(']]&gt;', '')
                      stats['gt'] += 1

                  # 2) Eliminar el plural problemático concreto
                  if 'custom_gifts_guidelines_info_monthly_limit' in src:
                      new = RE_PLURAL_NAMED.sub('', src)
                      if new != src:
                          print(f"[DEL plural] {p}")
                          src = new
                          stats['del'] += 1

                  # 3) Fix items en plurals (pair + self-closing)
                  def repl_block(m):
                      block = m.group(0)
                      he = block.find('>') + 1
                      ts = block.rfind('</plurals>')
                      if he <= 0 or ts <= 0: return block
                      head, body, tail = block[:he], block[he:ts], block[ts:]
                      def fx_self(im):
                          attrs = im.group(1) or ''
                          if 'quantity' in attrs: return im.group(0)
                          stats['pl_self'] += 1
                          return f'<item quantity="other"{attrs}/>'
                      def fx_pair(im):
                          attrs = im.group(1) or ''
                          if 'quantity' in attrs: return im.group(0)
                          stats['pl_pair'] += 1
                          return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                      body = RE_ITEM_SELF.sub(fx_self, body)
                      body = RE_ITEM.sub(fx_pair, body)
                      return head + body + tail
                  src = RE_PLURAL_BLOCK.sub(repl_block, src)

                  # 4) Escapar apóstrofos sin escape dentro del texto de cada item
                  # de plurals. Android exige \' en cadenas; no modificar atributos
                  # XML ni apóstrofos que ya estén escapados.
                  def escape_plural_item(m):
                      item = m.group(0)
                      open_end = item.find('>') + 1
                      close_start = item.rfind('</item>')
                      if open_end <= 0 or close_start < open_end:
                          return item
                      head, body, tail = item[:open_end], item[open_end:close_start], item[close_start:]
                      body = re.sub(
                          r'[^<>]+',
                          lambda t: re.sub(r"(?<!\\)'", r"\'", t.group(0)),
                          body
                      )
                      return head + body + tail

                  def escape_plural_block(m):
                      return RE_ITEM.sub(escape_plural_item, m.group(0))

                  before_apostrophes = src
                  src = RE_PLURAL_BLOCK.sub(escape_plural_block, src)
                  if src != before_apostrophes:
                      stats.setdefault('apostrophes', 0)
                      stats['apostrophes'] += src.count("\\'") - before_apostrophes.count("\\'")

                  if src != orig:
                      open(p, "w", encoding="utf-8").write(src)

          print(f"]]> eliminados: {stats['gt']}")
          print(f"<item>...</item> corregidos: {stats['pl_pair']}")
          print(f"<item/> self-closing corregidos: {stats['pl_self']}")
          print(f"<plurals> problemáticos eliminados: {stats['del']}")
          print(f"Apóstrofos escapados en plurals: {stats.get('apostrophes', 0)}")
          PYEOF

      - name: 7.3. Eliminar .9.png corruptos
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.3 =====" | tee -a "$LOG"
          find project/app/src/main/res -name "*.9.png" -type f -delete 2>&1 | tee -a "$LOG" || true
          echo "Restantes: $(find project/app/src/main/res -name '*.9.png' -type f 2>/dev/null | wc -l)" | tee -a "$LOG"

      - name: 7.4. Verificación source
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.4 =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re
          RES = "project/app/src/main/res"
          gt, pl = [], []
          for root, _, files in os.walk(RES):
              if not os.path.basename(root).startswith("values"): continue
              for fn in files:
                  if not fn.lower().endswith(".xml"): continue
                  p = os.path.join(root, fn)
                  src = open(p, encoding="utf-8", errors="replace").read()
                  if ']]>' in src or ']]&gt;' in src: gt.append(p)
                  for m in re.finditer(r'<plurals\b[^>]*>(.*?)</plurals>', src, re.DOTALL):
                      for im in re.finditer(r'<item(\s[^>]*)?/?>', m.group(1)):
                          if 'quantity' not in (im.group(1) or ''):
                              pl.append((p, im.group(0)[:80]))
          print(f"]]> / ]]&gt; en source: {len(gt)}")
          for p in gt[:20]: print(f"  {p}")
          print(f"plurals sin quantity en source: {len(pl)}")
          for p, frag in pl[:20]: print(f"  {p}: {frag}")
          print("OK source" if not gt and not pl else "WARN source")
          PYEOF

      - name: 7.5. Configurar Gradle y Plugins
        shell: bash
        run: |
          set -e
          cd project
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APK-Builder"
          include ':app'
          EOF

          if [ -f "app/build.gradle" ]; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.2.0'/g" app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application" version "8.2.0"/g' app/build.gradle
            if ! grep -q "com.android.application" app/build.gradle; then
              sed -i '1i plugins {\n    id "com.android.application" version "8.2.0"\n}\n' app/build.gradle
            fi
          fi
          cd ..

      - name: 7.7. Diagnóstico
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 7.7 =====" | tee -a "$LOG"
          echo "Archivos en res/: $(find project/app/src/main/res -type f | wc -l)" | tee -a "$LOG"
          echo "Peso res/: $(du -sh project/app/src/main/res | cut -f1)" | tee -a "$LOG"

      - name: 7.9. Memoria de Gradle
        shell: bash
        run: |
          set -e
          cd project
          rm -f gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          cd ..

      # ============================================================
      # PASO 8 — PRE-BUILD para poblar cache
      # ============================================================
      - name: 8.1. Pre-build para poblar cache de AARs
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.1: PRE-BUILD =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
          set +e
          "$G" --no-daemon --stacktrace :app:mergeDebugResources 2>&1 | tail -30 | tee -a "$LOG"
          set -e
          echo "Pre-build completado (aunque haya fallado, cache está poblada)" | tee -a "$LOG"

      # ============================================================
      # PASO 8.2 — PATCH AARs EN CACHE
      # ============================================================
      - name: 8.2. Patch AARs y transforms de Gradle cache
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== STEP 8.2: PATCH AARs =====" | tee -a "$LOG"
          python3 - <<'PYEOF' 2>&1 | tee -a "$LOG"
          import os, re, zipfile, glob

          HOME = os.path.expanduser("~")
          CACHE = os.path.join(HOME, ".gradle", "caches")
          if not os.path.isdir(CACHE):
              print("No hay cache"); raise SystemExit(0)

          RE_PLURAL = re.compile(r'<plurals\b[^>]*>.*?</plurals>', re.DOTALL)
          RE_ITEM = re.compile(r'<item(\s[^>]*)?>(.*?)</item>', re.DOTALL)
          RE_ITEM_SELF = re.compile(r'<item(\s[^>]*)?/>')

          def fix_xml(text):
              orig = text
              text = text.replace(']]>', '')
              text = text.replace(']]&gt;', '')
              def repl_block(m):
                  block = m.group(0)
                  he = block.find('>') + 1
                  ts = block.rfind('</plurals>')
                  if he <= 0 or ts <= 0: return block
                  head, body, tail = block[:he], block[he:ts], block[ts:]
                  def fx_self(im):
                      attrs = im.group(1) or ''
                      if 'quantity' in attrs: return im.group(0)
                      return f'<item quantity="other"{attrs}/>'
                  def fx_pair(im):
                      attrs = im.group(1) or ''
                      if 'quantity' in attrs: return im.group(0)
                      return f'<item quantity="other"{attrs}>{im.group(2)}</item>'
                  body = RE_ITEM_SELF.sub(fx_self, body)
                  body = RE_ITEM.sub(fx_pair, body)
                  return head + body + tail
              text = RE_PLURAL.sub(repl_block, text)
              return text, text != orig

          total = 0

          # 1. Transforms (extraídos)
          for tdir in glob.glob(os.path.join(CACHE, "transforms-*")):
              for root, _, files in os.walk(tdir):
                  rp = root.replace("\\", "/")
                  if "/transformed/" not in rp: continue
                  if "/res/values" not in rp: continue
                  for fn in files:
                      if not fn.endswith(".xml"): continue
                      p = os.path.join(root, fn)
                      try:
                          text = open(p, encoding="utf-8", errors="replace").read()
                          t2, ch = fix_xml(text)
                          if ch:
                              open(p, "w", encoding="utf-8").write(t2)
                              print(f"[TRANSFORM] {p}")
                              total += 1
                      except: pass

          # 2. AARs originales
          for aar in glob.glob(os.path.join(CACHE, "modules-2", "**", "*.aar"), recursive=True):
              try:
                  with zipfile.ZipFile(aar, 'r') as zin:
                      changes = {}
                      for name in zin.namelist():
                          if not name.endswith(".xml"): continue
                          if "/res/values" not in name: continue
                          data = zin.read(name).decode("utf-8", errors="replace")
                          nd, ch = fix_xml(data)
                          if ch:
                              changes[name] = nd
                              print(f"[AAR] {aar}::{name}")
                              total += 1
                      if changes:
                          tmp = aar + ".patched"
                          with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                              for item in zin.infolist():
                                  if item.filename in changes:
                                      zout.writestr(item, changes[item.filename])
                                  else:
                                      zout.writestr(item, zin.read(item.filename))
                          os.replace(tmp, aar)
              except: pass

          print(f"Total parcheados: {total}")
          PYEOF

      # ============================================================
      # PASO 8.3 — BUILD FINAL + DIAGNOSTICO FORENSE
      # ============================================================
      - name: 8.3. Build final y diagnostico forense
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          REPORT="$GITHUB_WORKSPACE/resource-forensics.txt"
          echo "===== STEP 8.3: BUILD FINAL =====" | tee -a "$LOG"
          cd project
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

          set +e
          "$G" --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            cd "$GITHUB_WORKSPACE"
            {
              echo "=================================================="
              echo "DIAGNOSTICO FORENSE DE RECURSOS ANDROID"
              echo "Fecha UTC: $(date -u)"
              echo "Codigo de salida Gradle: $RC"
              echo "=================================================="

              python3 - <<'PYEOF'
          import os
          import glob
          import xml.etree.ElementTree as ET

          ROOT = "project/app/src/main/res"
          BUILD = "project/app/build/intermediates"
          inspected = set()

          def inspect(path, origin):
              ap = os.path.abspath(path)
              if ap in inspected or not os.path.isfile(path):
                  return
              inspected.add(ap)
              try:
                  with open(path, encoding="utf-8", errors="replace") as f:
                      data = f.read()
              except Exception as e:
                  print(f"[READ_ERROR] {path}: {e}")
                  return

              print(f"\n===== XML [{origin}]: {path} =====")
              try:
                  root = ET.fromstring(data)
              except Exception as e:
                  print(f"[INVALID_XML] {e}")
                  for n, line in enumerate(data.splitlines(), 1):
                      if any(x in line for x in (
                          "<plurals", "</plurals>", "<item", "xliff:g",
                          "<![CDATA[", "]]>", "]]&gt;"
                      )):
                          print(f"  LINE {n}: {line.strip()[:700]}")
                  return

              for node in root.iter():
                  tag = node.tag.split("}")[-1]
                  if tag != "plurals":
                      continue
                  name = node.get("name")
                  print(f"[PLURALS] name={name!r}")
                  if not name:
                      print("  [ERROR] elemento plurals sin atributo name")
                  for child in list(node):
                      ctag = child.tag.split("}")[-1]
                      if ctag != "item":
                          print(f"  [UNEXPECTED_CHILD] tag={ctag!r} attrs={dict(child.attrib)!r}")
                          continue
                      quantity = child.get("quantity")
                      if not quantity:
                          print(f"  [MISSING_QUANTITY] item attrs={dict(child.attrib)!r}")
                      elif quantity not in ("zero", "one", "two", "few", "many", "other"):
                          print(f"  [INVALID_QUANTITY] {quantity!r}; attrs={dict(child.attrib)!r}")
                      if not child.attrib.get("quantity"):
                          print("  [ITEM_XML]", ET.tostring(child, encoding="unicode")[:1000])
                      for nested in child.iter():
                          if nested is child:
                              continue
                          ntag = nested.tag.split("}")[-1]
                          if ntag in ("g", "xliff:g"):
                              print(f"  [NESTED_TAG] tag={ntag!r} attrs={dict(nested.attrib)!r}")

          if os.path.isdir(ROOT):
              for base, dirs, files in os.walk(ROOT):
                  if not os.path.basename(base).startswith("values"):
                      continue
                  for fn in files:
                      if fn.endswith(".xml"):
                          inspect(os.path.join(base, fn), "SOURCE")

          patterns = [
              os.path.join(BUILD, "**", "merged.dir", "values", "*.xml"),
              os.path.join(BUILD, "**", "merged.dir", "values-*", "*.xml"),
              os.path.join(BUILD, "**", "merged_res", "values", "*.xml"),
              os.path.join(BUILD, "**", "merged_res", "values-*", "*.xml"),
          ]
          for pattern in patterns:
              for path in sorted(glob.glob(pattern, recursive=True)):
                  inspect(path, "MERGED")

          print("\n===== FIN DEL DIAGNOSTICO =====")
          PYEOF
            } 2>&1 | tee "$REPORT" | tee -a "$LOG"

            echo "===== ARCHIVOS DE RECURSOS COMBINADOS =====" | tee -a "$LOG"
            find project/app/build/intermediates \
              -type f \( -name "values.xml" -o -name "values-*.xml" \) \
              2>/dev/null | head -200 | tee -a "$LOG" || true

            echo "===== CONTEXTO DEL ERROR AAPT/GRADLE =====" | tee -a "$LOG"
            grep -n -B 10 -A 20 -E \
              "ResourceCompilationException|TableExtractor|AAPT: error|error:" \
              "$LOG" | tail -250 | tee -a "$LOG" || true
          fi

          exit "$RC"

      - name: 8.4. Aislar plurals con configuración Android válida
        if: always()
        shell: bash
        run: |
          set +e
          REPORT="$GITHUB_WORKSPACE/resource-isolation.txt"
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 2>/dev/null | sort | tail -1)"
          fi

          {
            echo "===== AISLAMIENTO INDIVIDUAL DE PLURALS ====="
            echo "AAPT2: $AAPT2"
            if [ ! -x "$AAPT2" ]; then
              echo "ERROR: no se encontró AAPT2"
              exit 0
            fi

            python3 - "$AAPT2" <<'PYEOF'
          import os
          import sys
          import tempfile
          import subprocess
          import xml.etree.ElementTree as ET

          aapt2 = sys.argv[1]
          base = (
              "project/app/build/intermediates/incremental/"
              "debug/mergeDebugResources/merged.dir"
          )
          sources = [
              os.path.join(base, "values", "values.xml"),
              os.path.join(base, "values-hi", "values-hi.xml"),
          ]
          total = failures = inconclusive = 0

          for source in sources:
              if not os.path.isfile(source):
                  print(f"[NO_EXISTE] {source}")
                  continue
              try:
                  root = ET.parse(source).getroot()
              except Exception as exc:
                  print(f"[XML_INVALIDO] {source}: {exc}")
                  continue

              plurals = [n for n in list(root) if n.tag.split("}")[-1] == "plurals"]
              print(f"\n[ARCHIVO] {source} | plurals={len(plurals)}")

              for index, plural in enumerate(plurals, 1):
                  name = plural.get("name", f"sin_nombre_{index}")
                  total += 1
                  with tempfile.TemporaryDirectory(prefix="aapt2-isolation-") as td:
                      # Android identifica la configuración mediante el directorio values.
                      values_dir = os.path.join(td, "res", "values")
                      os.makedirs(values_dir, exist_ok=True)
                      input_xml = os.path.join(values_dir, "isolated.xml")
                      output_zip = os.path.join(td, "compiled.zip")
                      wrapper = ET.Element("resources")
                      wrapper.append(plural)
                      ET.ElementTree(wrapper).write(
                          input_xml, encoding="utf-8", xml_declaration=True
                      )
                      try:
                          result = subprocess.run(
                              [aapt2, "compile", "-o", output_zip, input_xml],
                              stdout=subprocess.PIPE,
                              stderr=subprocess.PIPE,
                              text=True,
                              timeout=20,
                          )
                          details = (result.stderr or result.stdout).strip()
                          if result.returncode == 0:
                              print(f"[OK] {name}")
                          elif "invalid configuration" in details.lower():
                              inconclusive += 1
                              print(f"[INCONCLUSO] {name}: configuración inválida")
                              print(details[:1200])
                          else:
                              failures += 1
                              print(f"[FALLA_REAL] {name}")
                              print(details[:2000])
                      except subprocess.TimeoutExpired:
                          inconclusive += 1
                          print(f"[TIMEOUT] {name}")
                      except Exception as exc:
                          inconclusive += 1
                          print(f"[ERROR_DIAGNOSTICO] {name}: {exc}")

          print("\n===== RESUMEN =====")
          print(f"Plurals examinados: {total}")
          print(f"Fallos individuales: {failures}")
          print(f"Inconclusos: {inconclusive}")
          print("Una compilación individual correcta no garantiza que el merge completo funcione.")
          PYEOF
          } 2>&1 | tee "$REPORT"
          echo "Informe guardado en: $REPORT"

      - name: 9. Subir logs y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            resource-forensics.txt
            resource-isolation.txt
            project/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/
            project/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values-hi/
          if-no-files-found: ignore

      - name: 10. Subir APK (si compiló)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
